# Toolchain for the modular traffic analysis system.
# `mise install` provisions everything below. See plan/ for architecture.

[tools]
go = "1.25"
python = "3.12"
uv = "latest"
buf = "1"

# protoc plugins for Go codegen (built via the `go:` backend)
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "latest"

[env]
# Keep Go from auto-downloading a different toolchain than the one mise pins.
GOTOOLCHAIN = "local"
# Data root for the gateway in dev: session bundles + catalog.sqlite.
DATA_ROOT = "{{config_root}}/data"

[tasks.gen]
description = "Generate gRPC stubs (Go via buf; Python via grpcio-tools)"
run = [
  "buf generate proto",
  "mkdir -p capture/capture_sdk/capture_sdk/gen tui/gen mcp/gen",
  "uv run --project capture/capture_sdk --with grpcio-tools python -m grpc_tools.protoc -Iproto --python_out=capture/capture_sdk/capture_sdk/gen --grpc_python_out=capture/capture_sdk/capture_sdk/gen --pyi_out=capture/capture_sdk/capture_sdk/gen proto/traffic/v1/common.proto proto/traffic/v1/ingest.proto proto/traffic/v1/viewer.proto proto/traffic/v1/control.proto",
  "uv run --project tui python -m grpc_tools.protoc -Iproto --python_out=tui/gen --grpc_python_out=tui/gen --pyi_out=tui/gen proto/traffic/v1/common.proto proto/traffic/v1/ingest.proto proto/traffic/v1/viewer.proto proto/traffic/v1/control.proto",
  "uv run --project mcp python -m grpc_tools.protoc -Iproto --python_out=mcp/gen --grpc_python_out=mcp/gen --pyi_out=mcp/gen proto/traffic/v1/common.proto proto/traffic/v1/ingest.proto proto/traffic/v1/viewer.proto proto/traffic/v1/control.proto",
]

[tasks.lint-proto]
description = "Lint the proto contract"
run = "buf lint proto"

[tasks."gateway:build"]
description = "Build the gateway binary"
dir = "gateway"
run = "go build ./..."

[tasks."gateway:test"]
description = "Run the gateway tests"
dir = "gateway"
run = "go test ./..."

[tasks."tui:test"]
description = "Run the tui tests"
dir = "tui"
run = "uv run --group dev pytest"
