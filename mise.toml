# Toolchain for the modular traffic analysis system.
# `mise install` provisions everything below. See plan/ for architecture.

[tools]
go = "1.25"
python = "3.12"
uv = "latest"
buf = "1"

# protoc plugins for Go codegen (built via the `go:` backend)
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "latest"

[env]
# Keep Go from auto-downloading a different toolchain than the one mise pins.
GOTOOLCHAIN = "local"

[tasks.gen]
description = "Generate gRPC stubs (Go via buf; Python via grpcio-tools)"
run = [
  "buf generate proto",
  # Pin grpcio-tools to the grpcio floor the projects declare (>=1.76): the generated
  # _grpc.py stamps a GRPC_GENERATED_VERSION and refuses to run on an older grpcio, so
  # generating with a newer tools than the runtime grpcio (e.g. 1.82 tools vs a 1.81
  # runtime) breaks capture at import. Matching the floor keeps the stubs runnable on any
  # grpcio>=1.76.
  "uv run --project proto/python --with 'grpcio-tools==1.76.*' python -m grpc_tools.protoc -Iproto --python_out=proto/python --grpc_python_out=proto/python --pyi_out=proto/python proto/traffic/v1/common.proto proto/traffic/v1/ingest.proto proto/traffic/v1/viewer.proto proto/traffic/v1/control.proto proto/traffic/v1/source.proto",
]

[tasks.lint-proto]
description = "Lint the proto contract"
run = "buf lint proto"

[tasks."gateway:build"]
description = "Build the gateway binary"
dir = "gateway"
run = "go build ./..."

[tasks."gateway:test"]
description = "Run the gateway tests"
dir = "gateway"
run = "go test ./..."

[tasks."tui:test"]
description = "Run the tui tests"
dir = "tui"
run = "uv run --group dev pytest"

[tasks."mcp:test"]
description = "Run the trafficdeck-mcp tests"
dir = "mcp"
run = "uv run --group dev python -m pytest"

[tasks."capture-android:test"]
description = "Run the Android capture module's tests (no device needed)"
dir = "capture/capture_android"
run = "uv run --group dev python -m pytest"

[tasks."capture-mitmproxy:test"]
description = "Run the mitmproxy capture module's tests"
dir = "capture/capture_mitmproxy"
run = "uv run --group dev python -m pytest"
