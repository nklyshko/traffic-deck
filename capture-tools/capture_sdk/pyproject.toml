[project]
name = "capture-sdk"
version = "0.0.0"
description = "Shared SDK for the capture tools: gRPC stubs, upload streaming, interactive prompts"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.76",
    "protobuf>=5.29",
    "questionary>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_sdk"]
# The generated stubs under capture_sdk/gen/ are gitignored; force-include them so the
# package works when built (editable installs find them via the source tree directly).
artifacts = ["capture_sdk/gen/**/*.py", "capture_sdk/gen/**/*.pyi"]
