[project]
name = "capture-mitmproxy"
version = "0.0.0"
description = "mitmproxy capture agent → traffic-gateway (PushFlows; any device, incl. WireGuard)"
requires-python = ">=3.12"
dependencies = [
    "capture-sdk",
    "mitmproxy>=11",
]

[project.scripts]
capture-mitmproxy = "capture_mitmproxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
capture-sdk = { path = "../capture_sdk", editable = true }
