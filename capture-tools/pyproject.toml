[project]
name = "capture-tools"
version = "0.0.0"
description = "Capture agents (Chrome, mitmproxy, Android) for the traffic analysis system"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.76",
    "grpcio-tools>=1.76",
    "protobuf>=5.29",
    "mitmproxy>=11",
    # frida 17 dropped support for older Android (e.g. Android 10 → "unable to pick a
    # payload base" on spawn); 16.7.x covers Android 10–15. Client+server versions must
    # match, and the agent fetches the matching frida-server.
    "frida>=16.7,<17",
]

[tool.uv]
package = false
