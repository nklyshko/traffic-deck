[project]
name = "capture-tools"
version = "0.0.0"
description = "Capture agents (Chrome, mitmproxy, Android) for the traffic analysis system"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.76",
    "grpcio-tools>=1.76",
    "protobuf>=5.29",
    "mitmproxy>=11",
    # Client+server versions must match, and the agent fetches the matching
    # frida-server. frida 17 dropped support for older Android (e.g. Android 10 → spawn
    # "unable to pick a payload base"); the interactive CLI picks a version per device
    # and runs the capture under it via `uv run --with frida==<ver>`, so allow 16 & 17.
    "frida>=16.7,<18",
]

[tool.uv]
package = false
