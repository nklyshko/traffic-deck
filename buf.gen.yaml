version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: gitlab.com/nklyshko/traffic-deck/gateway/gen
plugins:
  - local: protoc-gen-go
    out: gateway/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gateway/gen
    opt: paths=source_relative
