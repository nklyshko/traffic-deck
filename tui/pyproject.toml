[project]
name = "trafficdeck-tui"
version = "0.0.0"
description = "Textual TUI for browsing decoded traffic"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "grpcio>=1.76",
    "grpcio-tools>=1.76",
    "protobuf>=5.29",
]

[project.scripts]
trafficdeck-tui = "traffic_viewer.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["traffic_viewer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
