syntax = "proto3";

package traffic.v1;

import "traffic/v1/common.proto";

// viewer <-> gateway. Read side: list sessions, stream/inspect flows.
service ViewerService {
  rpc ListSessions(ListSessionsRequest) returns (SessionList);
  // QueryFlows returns one page of a session's flows, filtered by the gateway. Paging is
  // a request and liveness is a stream (ADR-0012): a viewer calls this for the rows it
  // displays and StreamFlows to stay current, and both take the same filter.
  rpc QueryFlows(QueryFlowsRequest) returns (FlowPage);
  rpc StreamFlows(StreamFlowsRequest) returns (stream FlowEvent);
  rpc GetFlow(GetFlowRequest) returns (Flow);
  rpc GetBody(GetBodyRequest) returns (stream BodyChunk);

  // WebSocket message timeline for an Upgrade flow.
  rpc ListMessages(ListMessagesRequest) returns (MessageList);
  // GetMessage returns one message with its annotations (for refreshing a row after an
  // annotation change), the message-side counterpart of GetFlow.
  rpc GetMessage(GetMessageRequest) returns (WsMessage);
  // StreamMessages replays an Upgrade flow's stored frames, then (if follow is set
  // and the session is live) streams new frames as they're decoded, until the
  // session closes or the client disconnects — the live WebSocket timeline.
  rpc StreamMessages(StreamMessagesRequest) returns (stream MessageEvent);
  rpc GetMessageBody(GetMessageBodyRequest) returns (stream BodyChunk);

  // QuerySQL runs one read-only SQL statement against a session bundle's flows.sqlite
  // (or the catalog), for the aggregations and joins the filter DSL deliberately does
  // not express — "which authorities served a 429", "header names by frequency". It is
  // an escape hatch, not the read path: it sees the bundle as written, so a session
  // still capturing is missing its unflushed tail (which QueryFlows merges in), and a
  // large body is a blobs row pointing at a file rather than bytes (that's GetBody).
  //
  // Read-only is enforced by SQLite — the connection is opened mode=ro with
  // query_only and no attachable databases, on which every write fails — not by
  // inspecting the statement.
  rpc QuerySQL(QuerySQLRequest) returns (QuerySQLResponse);
}

message ListSessionsRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}

message SessionList {
  repeated Session sessions = 1;
}

// FlowCursor is a position in a session's timeline, not an offset: a live session grows
// while it is read, so OFFSET would shift rows under the reader. It is the sort key of
// the last row a page returned — page forward with `after`, backward with `before`.
message FlowCursor {
  int64 ts_micros = 1;
  uint64 frame_number = 2;
}

message QueryFlowsRequest {
  string session_id = 1;
  // Filter expression in the viewer DSL, evaluated by the gateway. Empty matches all.
  string filter = 2;
  uint32 limit = 3;
  // Exactly one of after/before, or neither for the first page. `before` walks backwards
  // from the given position; with no cursor set, `last` starts at the end of the list —
  // which is how "jump to the end" works without knowing how many rows match.
  FlowCursor after = 4;
  FlowCursor before = 5;
  bool last = 6;
  // Request-time window, in unix micros; 0 is unbounded. Fields rather than filter terms
  // deliberately: every DSL argument is a regex, and a time bound is a range on
  // (ts_micros, frame_number) — the paging key, which the index is already built for, so
  // it costs the predicate nothing. Relative times ("-15m") resolve against the caller's
  // clock and are sent absolute, so a filter means the same thing whenever it runs.
  int64 since_micros = 7;
  int64 until_micros = 8;
}

message FlowPage {
  repeated Flow flows = 1;
  // Cursors for stepping on from this page; unset when there is nothing that way.
  FlowCursor next = 2;
  FlowCursor prev = 3;
  // Rows matched, and whether the scan cap stopped counting — so a viewer can say
  // "500+ matching" rather than a precise number it cannot cheaply have (ADR-0012 §5).
  uint64 matched = 4;
  bool count_capped = 5;
  // Rows examined, for the same reason MCP already reports it: a filter that matched
  // little may have been cut short rather than genuinely finding little.
  uint64 scanned = 6;
  // Advisory diagnostics for an expression that parses but does not mean what it looks
  // like — `~d a & ~c 200` matches `&` as a URL regex rather than failing. Part of the
  // language, so they come from whoever owns it (ADR-0012 §9).
  repeated string hints = 7;
}

message StreamFlowsRequest {
  string session_id = 1;
  bool follow = 3;  // keep streaming live events
  // Same DSL as QueryFlows: a following viewer receives only events for flows matching
  // it, and a flow_unmatched when an update pushes one out of that set.
  string filter = 4;

  reserved 2;                    // was include_backfill: never read; backfill is QueryFlows'
  reserved "include_backfill";   // job now (ADR-0012 §4)
}

message SessionEvent {
  string session_id = 1;
  SessionStatus status = 2;
}

message FlowEvent {
  oneof event {
    Flow flow_added = 1;
    Flow flow_updated = 2;
    SessionEvent session_event = 3;
    DecodeProgress decode_progress = 4;
    // The flow no longer matches *this subscription's* filter — drop the row. NOT a
    // deletion: the flow still exists, and a subscriber with a different filter still
    // sees it. Only the gateway can know this, having evaluated the filter before and
    // after the update, so a client that ignores this shows stale rows (ADR-0012 §6).
    string flow_unmatched = 5;
  }
}

message GetFlowRequest {
  string session_id = 1; // flows live in per-session SQLite bundles
  string flow_id = 2;
}

message GetBodyRequest {
  string session_id = 1;
  string flow_id = 2;
  bool response = 3; // false = request body, true = response body
}

message BodyChunk {
  bytes payload = 1;
  // Set on every chunk of a body the live decode only kept the start of (see
  // Body.truncated): the payloads add up to a prefix, not the whole body. A caller that
  // needs all of it has to wait for the session to close and re-fetch. A truncated body
  // always sends at least one chunk, so the flag is never lost to an empty stream.
  bool truncated = 2;
}

message ListMessagesRequest {
  string session_id = 1;
  string flow_id = 2; // the Upgrade flow whose frames to list
  // Message filter expression, evaluated by the gateway. Empty matches all. A different
  // term set from the flow filter — a frame has a payload, an opcode and a direction, not
  // a method or a status — so an expression written for flows is refused rather than
  // quietly matching the payload (see docs/filters.md).
  string filter = 3;
}

message MessageList {
  repeated WsMessage messages = 1;
  // Advisory diagnostics for the request's filter, like FlowPage.hints.
  repeated string hints = 2;
}

message StreamMessagesRequest {
  string session_id = 1;
  string flow_id = 2; // the Upgrade flow whose frames to stream
  bool follow = 3;    // keep streaming live frames until the session closes
  // Same DSL as ListMessages: backfill and live frames are both filtered, so a filtered
  // timeline stays filtered as it grows.
  string filter = 4;
}

message MessageEvent {
  oneof event {
    WsMessage message_added = 1;
    SessionEvent session_event = 2; // session closed — live stream ended
    // Advisory diagnostics for this subscription's filter, sent once before any frame.
    // A stream has no page to carry them on, and they are part of the language rather
    // than of any one client, so every viewer gets them (ADR-0012 §9).
    FilterHints filter_hints = 3;
  }
}

message FilterHints {
  repeated string hints = 1;
}

message GetMessageRequest {
  string session_id = 1;
  string message_id = 2;
}

message GetMessageBodyRequest {
  string session_id = 1;
  string message_id = 2;
  bool raw = 3; // fetch the original undecoded bytes instead of the decoded payload
}

message QuerySQLRequest {
  // Session bundle to query; empty queries the global catalog (sessions, tags, groups).
  string session_id = 1;
  // One SQL statement. `?` placeholders are bound from params — the way to put a value
  // into a query, since the caller cannot know how to quote for SQLite.
  string sql = 2;
  repeated string params = 3;
  // Max rows returned; 0 takes the gateway's default. The gateway caps it either way.
  uint32 limit = 4;
  // Abandon the query after this long; 0 takes the gateway's default. A cross join on a
  // 273k-flow bundle is one keystroke away, so it gets a deadline rather than the
  // gateway's read path a stall.
  uint32 timeout_millis = 5;
}

message QuerySQLResponse {
  // Column names in the statement's own order (a JSON object does not keep it).
  repeated string columns = 1;
  // One JSON object per row, keyed by column name: null / number / bool / string, with a
  // BLOB base64-encoded as a string (bundles hold raw ClientHellos and bodies as blobs).
  // JSON rather than a typed value message because the caller is an agent reading text
  // and every client already has a JSON parser.
  repeated string rows_json = 2;
  // More rows matched than were returned — raise limit or aggregate in SQL.
  bool truncated = 3;
  uint64 elapsed_micros = 4;
}
