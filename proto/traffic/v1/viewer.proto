syntax = "proto3";

package traffic.v1;

import "traffic/v1/common.proto";

// viewer <-> gateway. Read side: list sessions, stream/inspect flows.
service ViewerService {
  rpc ListSessions(ListSessionsRequest) returns (SessionList);
  rpc StreamFlows(StreamFlowsRequest) returns (stream FlowEvent);
  rpc GetFlow(GetFlowRequest) returns (Flow);
  rpc GetBody(GetBodyRequest) returns (stream BodyChunk);

  // WebSocket message timeline for an Upgrade flow.
  rpc ListMessages(ListMessagesRequest) returns (MessageList);
  // StreamMessages replays an Upgrade flow's stored frames, then (if follow is set
  // and the session is live) streams new frames as they're decoded, until the
  // session closes or the client disconnects — the live WebSocket timeline.
  rpc StreamMessages(StreamMessagesRequest) returns (stream MessageEvent);
  rpc GetMessageBody(GetMessageBodyRequest) returns (stream BodyChunk);
}

message ListSessionsRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}

message SessionList {
  repeated Session sessions = 1;
}

message StreamFlowsRequest {
  string session_id = 1;
  bool include_backfill = 2; // replay stored flows first
  bool follow = 3;           // keep streaming live additions
}

message SessionEvent {
  string session_id = 1;
  SessionStatus status = 2;
}

message FlowEvent {
  oneof event {
    Flow flow_added = 1;
    Flow flow_updated = 2;
    SessionEvent session_event = 3;
    DecodeProgress decode_progress = 4;
  }
}

message GetFlowRequest {
  string session_id = 1; // flows live in per-session SQLite bundles
  string flow_id = 2;
}

message GetBodyRequest {
  string session_id = 1;
  string flow_id = 2;
  bool response = 3; // false = request body, true = response body
}

message BodyChunk {
  bytes payload = 1;
}

message ListMessagesRequest {
  string session_id = 1;
  string flow_id = 2; // the Upgrade flow whose frames to list
}

message MessageList {
  repeated WsMessage messages = 1;
}

message StreamMessagesRequest {
  string session_id = 1;
  string flow_id = 2; // the Upgrade flow whose frames to stream
  bool follow = 3;    // keep streaming live frames until the session closes
}

message MessageEvent {
  oneof event {
    WsMessage message_added = 1;
    SessionEvent session_event = 2; // session closed — live stream ended
  }
}

message GetMessageBodyRequest {
  string session_id = 1;
  string message_id = 2;
}
