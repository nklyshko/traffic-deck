syntax = "proto3";

package traffic.v1;

import "traffic/v1/common.proto";

// viewer -> gateway -> tools. Capture control, re-decode, annotations.
service ControlService {
  // Capture control. The viewer lists the sources the gateway can drive, describes a
  // chosen source's options (re-called as fields fill, for cascading), then starts a
  // capture; the gateway dispatches each to the source's CaptureSourceService. See ADR-0010.
  rpc ListCaptureSources(Empty) returns (CaptureSourceList);
  rpc DescribeCaptureSource(DescribeCaptureSourceRequest) returns (SourceDescriptor);
  rpc StartCapture(StartCaptureRequest) returns (StartCaptureResponse);
  rpc StopCapture(StopCaptureRequest) returns (StopCaptureResponse);
  rpc ReDecode(ReDecodeRequest) returns (stream DecodeProgress);

  // Auxiliary services — gateway-owned processes that are *not* capture sources (the MCP
  // server; a module's web UI). A viewer toggles them; the gateway owns them, so they
  // outlive the viewer. See ADR-0010.
  rpc ListServices(Empty) returns (ServiceList);
  rpc StartService(ServiceRequest) returns (ServiceInfo);
  rpc StopService(ServiceRequest) returns (Empty);

  // Is a newer version published? The gateway compares each component's checkout against
  // its git remote and caches the answer; a component is TrafficDeck itself or a module that
  // declared `source_dir` in its manifest. The viewer owns the cadence — it decides when to
  // ask and when to notify — so the only schedule the gateway keeps is one check at launch.
  // See ADR-0014.
  rpc CheckUpdates(CheckUpdatesRequest) returns (UpdateStatus);

  // Child logs. The gateway keeps one rolling file per spawned child (capture source,
  // service, module process) plus its own; a viewer lists them and reads the tail of one,
  // streamed in chunks. The gateway owns the files, so a remote viewer needs no filesystem
  // access. See ADR-0010 logging.
  rpc ListLogs(Empty) returns (LogList);
  rpc GetLog(GetLogRequest) returns (stream LogChunk);

  // Export a whole session bundle (catalog row + flows.sqlite + pcap/key.log +
  // spilled blobs) as a self-contained .tar.gz, streamed in chunks.
  rpc ExportSession(ExportSessionRequest) returns (stream ExportChunk);

  // Assign a session to a (free-text) group for organizing the session list; "" clears it.
  rpc SetSessionGroup(SetSessionGroupRequest) returns (Empty);

  // Rename a session (set its label).
  rpc SetSessionLabel(SetSessionLabelRequest) returns (Empty);

  // Permanently delete a recorded session: its catalog entry and its whole bundle
  // (flows.sqlite, pcap/key.log, spilled blobs). Refused while the session is still open.
  rpc DeleteSession(DeleteSessionRequest) returns (Empty);

  // Import a .tar.gz session bundle (as produced by ExportSession), streamed in chunks.
  // The session is registered under a fresh id; returns the imported session.
  rpc ImportSession(stream ImportChunk) returns (ImportSessionResponse);

  // Locate a session's raw capture artifacts (pcap + NSS key.log) on the gateway host,
  // so a viewer running there can hand the same files to an external analyzer — the TUI
  // opens a flow in Wireshark this way. Paths resolve on the gateway host (the local
  // host under one-command mode); `hostname` lets a remote viewer tell they aren't its
  // own. A proxy-captured session has no pcap and reports empty paths.
  rpc GetSessionArtifacts(GetSessionArtifactsRequest) returns (SessionArtifacts);

  // Import a pre-captured pcap (+ optional NSS key.log) by batch-decoding it on the
  // gateway with the chosen engine, then registering the session. Mirrors the
  // `gateway import` CLI. Paths resolve on the gateway host — which is the local host
  // under the default one-command mode. Returns the imported session.
  rpc ImportCapture(ImportCaptureRequest) returns (ImportCaptureResponse);

  // --- Annotations. Bulk ops take repeated record_ids. ---

  // Tags (defs are global; assignments per-session).
  rpc CreateTag(CreateTagRequest) returns (Tag);
  rpc DeleteTag(DeleteTagRequest) returns (Empty);
  rpc ListTags(ListTagsRequest) returns (TagList);
  rpc SetTags(SetTagsRequest) returns (Empty);
  rpc ToggleFavorite(ToggleFavoriteRequest) returns (Empty);

  // Comments (per-session).
  rpc AddComment(AddCommentRequest) returns (Comment);
  rpc EditComment(EditCommentRequest) returns (Comment);
  rpc DeleteComment(DeleteCommentRequest) returns (Empty);

  // Color marks (per-session, single per record).
  rpc SetMark(SetMarkRequest) returns (Empty);
  rpc ClearMark(ClearMarkRequest) returns (Empty);

  // Groups (defs global; membership per-session).
  rpc CreateGroup(CreateGroupRequest) returns (Group);
  rpc UpdateGroup(UpdateGroupRequest) returns (Group);
  rpc DeleteGroup(DeleteGroupRequest) returns (Empty);
  rpc ListGroups(ListGroupsRequest) returns (GroupList);
  rpc SetGroups(SetGroupsRequest) returns (Empty);
}

message Empty {}

// --- Auxiliary services (see ADR-0010): opaque gateway-owned processes, toggled by the
// viewer. Not capture sources — no options, no sessions. ---

message ServiceRequest {
  string name = 1;
}

message ServiceList {
  repeated ServiceInfo services = 1;
}

message ServiceInfo {
  string name = 1;    // toggle key ("mcp", a module ui name)
  string label = 2;   // human label
  bool running = 3;
  string url = 4;      // where it's reachable when running (e.g. http://127.0.0.1:8765/mcp)
  string detail = 5;   // note for the viewer (e.g. exposure warning)
}

// --- Update checks (see ADR-0014): one entry per component the gateway can compare against
// its git remote — TrafficDeck itself, plus every module whose manifest declares
// `source_dir`. A module is not asked; the gateway reads its checkout. ---

message CheckUpdatesRequest {
  // false: answer from cache, immediately, without touching the network. This is the call
  // for a viewer's first paint.
  //
  // true: contact each remote before answering, so the reply may take as long as the
  // gateway's per-component timeout — give the call a deadline. Use it when the viewer's own
  // policy says the answer is stale (the web UI re-checks once a day, tracked in its own
  // localStorage; the TUI re-checks on an explicit keypress). The gateway serializes
  // concurrent refreshes and ignores one that arrives within a few minutes of the last
  // check, so N tabs opening at once cost one round of `ls-remote`, not N — a refresh can
  // therefore legitimately return an unchanged checked_unix_ms.
  bool refresh = 1;
}

message UpdateStatus {
  repeated ComponentUpdate components = 1;
  // When the cache was last filled. 0 = no check has completed yet, which a viewer must not
  // render as "up to date" — the viewer clients turn this case into a null/None instead of
  // an empty list, so no UI code can mistake the two.
  int64 checked_unix_ms = 2;
}

message ComponentUpdate {
  string name = 1;              // "trafficdeck", or the module's manifest name
  bool update_available = 2;    // the remote tip is not present in the local checkout
  string local_rev = 3;         // short HEAD
  string remote_rev = 4;        // short remote tip; empty when unknown
  // What to run, verbatim from the manifest's `update_hint` ("run …/update.sh"). Free text:
  // how to update is the module's business, and the gateway never executes it.
  string update_hint = 5;
  // Why this component could not be checked (no upstream, remote unreachable, not a git
  // checkout). update_available is false whenever this is set — offline is not up to date.
  string error = 6;
}

// --- Child logs (see ADR-0010 logging): the gateway's own log and one rolling file per
// spawned child, readable through the gateway so a remote viewer needs no disk access. ---

message LogList {
  repeated LogInfo logs = 1;
}

message LogInfo {
  string name = 1;              // stable id to pass to GetLog ("gateway", "chrome", a service key)
  string label = 2;             // human label ("gateway", "Chrome", "acme / adapter")
  int64 size_bytes = 3;
  int64 modified_unix_ms = 4;
}

message GetLogRequest {
  string name = 1;       // a name from ListLogs
  int64 max_bytes = 2;   // tail size to return; 0 = server default
}

message LogChunk {
  bytes payload = 1;
}

// --- Capture sources (see ADR-0010). These message/enum types are the control-plane
// vocabulary shared by ControlService (viewer-facing) and CaptureSourceService
// (source-facing, in source.proto, which imports this file). ---

message CaptureSourceList {
  repeated CaptureSourceInfo sources = 1;
}

message CaptureSourceInfo {
  string name = 1;       // dispatch key ("chrome", "android", a module name)
  string label = 2;      // human label
  bool keep_warm = 3;    // holds a warm resource across captures (Android's emulator)
}

// Viewer-facing describe: which source, plus the partial selection so far. Re-sent as
// fields fill in, for cascading. (The source-facing DescribeRequest omits `source` — the
// source is known by the connection.)
message DescribeCaptureSourceRequest {
  string source = 1;
  map<string, string> params = 2;
}

// Partial selection so far; empty on the first call.
message DescribeRequest {
  map<string, string> params = 1;
}

// The form a viewer renders for a source: ordered parameters plus readiness. A source that
// must provision an expensive resource before it can enumerate options returns
// readiness = PROVISION_REQUIRED with a `message`, rather than provisioning silently.
message SourceDescriptor {
  repeated Param params = 1;
  Readiness readiness = 2;
  string message = 3; // human-readable note (e.g. what provisioning will do)
}

enum Readiness {
  READINESS_UNSPECIFIED = 0;
  READINESS_READY = 1;              // params below are complete
  READINESS_PROVISION_REQUIRED = 2; // must provision first; see `message`
}

// One capture parameter the viewer prompts for. `key` is the params-map key passed back
// to StartCapture; the source decodes its own value strings.
message Param {
  string key = 1;
  string label = 2;
  ParamType type = 3;
  repeated Choice choices = 4; // populated for CHOICE
  string default = 5;          // preselected value ("" = none)
  bool required = 6;
}

enum ParamType {
  PARAM_TYPE_UNSPECIFIED = 0;
  PARAM_TYPE_STRING = 1;
  PARAM_TYPE_PATH = 2;
  PARAM_TYPE_BOOL = 3;
  PARAM_TYPE_INT = 4;
  PARAM_TYPE_CHOICE = 5;
}

message Choice {
  string value = 1; // stored in params
  string label = 2; // shown to the user
}

message ReleaseSourceRequest {}

message StatusRequest {}

message SourceStatus {
  SourceState state = 1;
  repeated string active_sessions = 2; // session ids currently capturing
  string detail = 3;
}

enum SourceState {
  SOURCE_STATE_UNSPECIFIED = 0;
  SOURCE_STATE_PROVISIONING = 1;
  SOURCE_STATE_READY = 2; // up, idle
  SOURCE_STATE_CAPTURING = 3;
}

message StartCaptureRequest {
  reserved 1;  // was SourceKind source_kind, superseded by `source` below
  reserved "source_kind";
  string label = 2;
  map<string, string> params = 3;
  // Source name — a built-in ("chrome", "android", …) or a module's declared name.
  // A closed enum cannot name a third-party module (see ADR-0010). The viewer-facing
  // ControlService.StartCapture uses this to dispatch; the source-facing
  // CaptureSourceService.StartCapture ignores it (the source is known by the connection).
  string source = 4;
}

message StartCaptureResponse {
  string session_id = 1;
}

message StopCaptureRequest {
  string session_id = 1;
}

message StopCaptureResponse {
  Session session = 1;
}

message ExportSessionRequest {
  string session_id = 1;
}

// One chunk of the streamed .tar.gz session bundle.
message ExportChunk {
  bytes data = 1;
}

message SetSessionGroupRequest {
  string session_id = 1;
  string group = 2;  // "" clears the group
}

message SetSessionLabelRequest {
  string session_id = 1;
  string label = 2;
}

message DeleteSessionRequest {
  string session_id = 1;
}

// One chunk of an uploaded .tar.gz session bundle (client-streamed to ImportSession).
message ImportChunk {
  bytes data = 1;
}

message ImportSessionResponse {
  Session session = 1;
}

message ImportCaptureRequest {
  string pcap_path = 1;    // path to the .pcap on the gateway host
  string keylog_path = 2;  // optional NSS key.log path (for TLS decryption)
  string label = 3;        // optional session label
  // Batch decoder: "tshark" (default when empty) orchestrates tshark; "native" runs the
  // in-process Go pipeline (no tshark). See ADR-0009.
  string engine = 4;
}

message ImportCaptureResponse {
  Session session = 1;
}

message GetSessionArtifactsRequest {
  string session_id = 1;
}

// Where a session's raw capture files live on the gateway host. A path is empty when
// that artifact is absent or empty (a proxy-captured session has no pcap; a capture
// without TLS keys has no key.log).
message SessionArtifacts {
  string pcap_path = 1;
  string keylog_path = 2;
  uint64 pcap_bytes = 3;
  uint64 keylog_bytes = 4;
  // Host the paths resolve on (the gateway's hostname), so a viewer can tell a remote
  // gateway's paths from its own filesystem.
  string hostname = 5;
}

message ReDecodeRequest {
  string session_id = 1;
}

// --- Tags ---

message CreateTagRequest {
  string name = 1;
  string color = 2;
}

message DeleteTagRequest {
  string id = 1;
}

message ListTagsRequest {}

message TagList {
  repeated Tag tags = 1;
}

message SetTagsRequest {
  string session_id = 1;
  repeated string record_ids = 2;
  repeated string add_tag_ids = 3;
  repeated string remove_tag_ids = 4;
}

message ToggleFavoriteRequest {
  string session_id = 1;
  repeated string record_ids = 2;
}

// --- Comments ---

message AddCommentRequest {
  string session_id = 1;
  string record_id = 2;
  string body = 3;
}

message EditCommentRequest {
  string session_id = 1;
  string id = 2;
  string body = 3;
}

message DeleteCommentRequest {
  string session_id = 1;
  string id = 2;
}

// --- Color marks ---

message SetMarkRequest {
  string session_id = 1;
  repeated string record_ids = 2;
  string color = 3;
}

message ClearMarkRequest {
  string session_id = 1;
  repeated string record_ids = 2;
}

// --- Groups ---

message CreateGroupRequest {
  string name = 1;
  string color = 2;
  string parent_id = 3;
}

message UpdateGroupRequest {
  string id = 1;
  string name = 2;
  string color = 3;
  string parent_id = 4;
}

message DeleteGroupRequest {
  string id = 1;
}

message ListGroupsRequest {}

message GroupList {
  repeated Group groups = 1;
}

message SetGroupsRequest {
  string session_id = 1;
  repeated string record_ids = 2;
  repeated string add_group_ids = 3;
  repeated string remove_group_ids = 4;
}
