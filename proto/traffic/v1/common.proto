syntax = "proto3";

package traffic.v1;

// Source that produced a capture.
enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_CHROME = 1;
  SOURCE_KIND_MITMPROXY = 2;
  SOURCE_KIND_ANDROID_EMULATOR = 3;
  SOURCE_KIND_ANDROID_DEVICE = 4;
  SOURCE_KIND_GENERIC = 5;
}

// Which uploaded artifact a chunk belongs to (see).
enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_PCAP = 1;
  FILE_KIND_KEYLOG = 2;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_OPEN = 1;
  SESSION_STATUS_DECODING = 2;
  SESSION_STATUS_CLOSED = 3;
  SESSION_STATUS_ERROR = 4;
}

// A capture session: one pcap + key.log and the flows decoded from it.
message Session {
  string id = 1;
  string label = 2;
  SourceKind source_kind = 3;
  SessionStatus status = 4;
  int64 created_at_unix_ms = 5;
  int64 closed_at_unix_ms = 6;
  uint64 pcap_bytes = 7;
  uint64 keylog_bytes = 8;
  uint32 flow_count = 9;
  // Free-text group label to organize sessions (a folder-like grouping); "" = ungrouped.
  string group = 10;

  // Opaque metadata the capture source supplied at OpenSession — verbatim key/value
  // pairs the gateway stores and surfaces. A source can declare `viewer.columns`
  // (comma-separated flow-metadata keys) to seed the viewer's default table columns.
  map<string, string> metadata = 11;
}

message Header {
  string name = 1;
  string value = 2;
}

message Cookie {
  string name = 1;
  string value = 2;
  // Set-Cookie attributes (populated for response cookies; empty/false for request
  // cookies, which are bare name=value).
  string domain = 3;
  string path = 4;
  string expires = 5;    // raw Expires value, if any
  int64 max_age = 6;     // Max-Age seconds; 0 when absent
  bool secure = 7;
  bool http_only = 8;
  string same_site = 9;  // "Strict" | "Lax" | "None" | ""
}

// A request or response body. Small bodies are inlined; large bodies carry only
// an object_ref (sha256) and are fetched in full via ViewerService.GetBody.
message Body {
  uint64 size = 1;
  string content_type = 2;
  oneof content {
    bytes inline = 3;
    string object_ref = 4; // sha256 key; fetch full bytes via GetBody
  }
}

// One decoded HTTP exchange (request + optional response).
message Flow {
  string id = 1;
  string session_id = 2;
  string analysis_id = 3;
  uint64 frame_number = 4;
  int64 ts_unix_micros = 5;
  string method = 6;
  string scheme = 7;
  string authority = 8;
  string path = 9;
  string query = 10;
  string protocol = 11;
  uint32 status = 12;
  string src_addr = 13;
  string dst_addr = 14;
  string user_agent = 15;
  string content_type = 16;
  uint64 request_bytes = 17;
  bool tls_decrypted = 18;
  string tcp_stream = 19;
  string h2_stream_id = 20;
  repeated Header request_headers = 21;
  repeated Header response_headers = 22;
  repeated Cookie request_cookies = 23;
  Body request_body = 24;
  Body response_body = 25;

  // Annotations. Summaries (ListFlows/StreamFlows) carry mark_color,
  // favorite, tag_ids, group_ids so rows render/filter without a second call;
  // GetFlow additionally fills comments.
  string mark_color = 26;        // single color marker ("" = none)
  bool favorite = 27;            // has the built-in Favorite tag
  repeated string tag_ids = 28;
  repeated string group_ids = 29;
  repeated Comment comments = 30;

  // WebSocket: set when this flow is an HTTP Upgrade that carries
  // WebSocket frames; the frames are WsMessages fetched via ListMessages.
  bool websocket = 31;
  uint32 ws_message_count = 32;

  // Proxy: set when this connection went through an HTTP CONNECT or SOCKS proxy,
  // detected from the captured handshake.
  Proxy proxy = 33;

  // Custom metadata attached by the capture source (e.g. proxy provider, pool,
  // region). Opaque key/value pairs the gateway stores and surfaces verbatim;
  // the gateway neither interprets nor validates them.
  map<string, string> metadata = 34;

  // Failure reason for a flow that got no response or hit a transport/protocol error
  // (e.g. "Connection timed out", "connection reset (TCP RST)",
  // "HTTP/2 RST_STREAM: REFUSED_STREAM"). Empty when the request completed normally.
  // Set by the capture source (mitmproxy flow.error) or derived from the pcap.
  string error = 35;

  // Request→response elapsed time in microseconds, once the response is in. 0 while the
  // request is still in flight (no response yet) — the viewer shows a live stopwatch from
  // ts_unix_micros until this is set.
  uint64 duration_micros = 36;

  // HTTP/2 client fingerprint (Akamai format): the connection's client SETTINGS, the
  // connection-level WINDOW_UPDATE increment, PRIORITY frames, and the request's pseudo-
  // header order, as "s1:v1;s2:v2|window|prio|m,a,s,p". Empty for non-HTTP/2 flows (and
  // for pushed/proxy sources, which don't see the raw frames). Anti-bot analysis compares
  // this against a real browser's stack.
  string http2_fingerprint = 37;

  // TLS ClientHello fingerprints, from the connection's decrypted handshake (empty for
  // plaintext / pushed-proxy flows). ja3 is the JA3 MD5; ja4 is the FoxIO JA4. tls_client_hello
  // is the human-readable ClientHello for export (the JA3 string — version,ciphers,
  // extensions,curves,point-formats — plus the offered ALPN).
  string ja3 = 38;
  string ja4 = 39;
  string tls_client_hello = 40;

  // Response cookies parsed from Set-Cookie, with full attributes (request_cookies above
  // are the bare name=value pairs from the Cookie request header). Derived from headers.
  repeated Cookie response_cookies = 41;

  // Redirect chain linking. redirect_location is the absolute Location URL this flow
  // redirects to (set for a 3xx response with a Location header, resolved against the
  // request URL). redirected_from_id is the id of the flow that redirected *to* this one
  // (its redirect_location matched this flow's request URL); computed across the session.
  string redirect_location = 42;
  string redirected_from_id = 43;

  // Raw TLS ClientHello handshake messages captured from the decrypted handshake, verbatim
  // (msg_type + length + body), in wire order — for export/replay. There is more than one
  // entry only when the server sent a HelloRetryRequest (tls_hrr), which makes the client
  // resend a second ClientHello. Empty for plaintext / pushed-proxy flows.
  repeated bytes client_hellos = 44;
  bool tls_hrr = 45;
}

// A proxy a connection was observed to go through, detected from the captured
// CONNECT/SOCKS handshake. Credentials are included when present in the capture.
message Proxy {
  string addr = 1;      // proxy endpoint host:port (the connection's peer)
  string type = 2;      // "http" (CONNECT) | "socks"
  string username = 3;  // proxy credentials, if seen on the wire
  string password = 4;
}

// One decoded WebSocket frame — a message-shaped record, distinct from
// the request/response Flow. Belongs to the Upgrade flow (flow_id) on its connection.
message WsMessage {
  string id = 1;
  string session_id = 2;
  string flow_id = 3;            // parent Upgrade flow
  uint64 frame_number = 4;
  int64 ts_unix_micros = 5;
  bool from_client = 6;          // direction: true = client→server
  string opcode = 7;             // text|binary|close|ping|pong|continuation
  Body payload = 8;              // inline (small) or object_ref (large)
  Body raw = 9;                  // original undecoded frame bytes, set when a custom decoder
                                 // produced this message; fetch full bytes via GetMessageBody raw=true

  // Annotations, mirroring Flow — a WebSocket/TCP-parsed message is an annotatable record
  // too (the annotation store is keyed on record_id, which is this message's id).
  string mark_color = 10;
  bool favorite = 11;
  repeated string tag_ids = 12;
  repeated string group_ids = 13;
  repeated Comment comments = 14;
}

// A named, colored label. Definitions are global (catalog) and mirrored
// into each session bundle that uses them; assignments live in the bundle.
message Tag {
  string id = 1;
  string name = 2;
  string color = 3;
  bool is_favorite = 4;          // the seeded built-in Favorite tag
  int64 created_at_unix_ms = 5;
}

// A free-form note attached to a record.
message Comment {
  string id = 1;
  string record_id = 2;
  string body = 3;
  int64 created_at_unix_ms = 4;
  int64 updated_at_unix_ms = 5;
}

// A user-defined, optionally hierarchical group.
message Group {
  string id = 1;
  string name = 2;
  string color = 3;
  string parent_id = 4;          // "" = top-level
  int64 created_at_unix_ms = 5;
}

// Progress of a decode run, streamed to viewers.
message DecodeProgress {
  string session_id = 1;
  uint32 percent = 2;
  string stage = 3;
  bool done = 4;
}
