[project]
name = "trafficdeck-proto"
version = "0.0.0"
description = "Generated Python gRPC stubs for the TrafficDeck contract"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.76",
    "protobuf>=5.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["traffic"]
