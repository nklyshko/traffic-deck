[project]
name = "traffic-viewer"
version = "0.0.0"
description = "Textual TUI for browsing decoded traffic"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "grpcio>=1.76",
    "grpcio-tools>=1.76",
    "protobuf>=5.29",
]

[project.scripts]
traffic-viewer = "traffic_viewer.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
