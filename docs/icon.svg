<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TrafficDeck">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- ===== isometric deck: three stacked cards (bottom -> top) ===== -->
  <g stroke="#131a33" stroke-width="2" stroke-linejoin="round">
    <!-- card 3 (bottom) -->
    <polygon points="128,302 256,366 256,382 128,318" fill="url(#leftFace)"/>
    <polygon points="256,366 384,302 384,318 256,382" fill="url(#rightFace)"/>
    <polygon points="256,238 384,302 256,366 128,302" fill="url(#topFace)"/>
    <!-- card 2 (middle) -->
    <polygon points="128,268 256,332 256,348 128,284" fill="url(#leftFace)"/>
    <polygon points="256,332 384,268 384,284 256,348" fill="url(#rightFace)"/>
    <polygon points="256,204 384,268 256,332 128,268" fill="url(#topFace)"/>
    <!-- card 1 (top) -->
    <polygon points="128,234 256,298 256,314 128,250" fill="url(#leftFace)"/>
    <polygon points="256,298 384,234 384,250 256,314" fill="url(#rightFace)"/>
    <polygon points="256,170 384,234 256,298 128,234" fill="url(#topFace)"/>
  </g>

  <!-- ===== request / response exchange arcing into the deck ===== -->
  <g transform="rotate(-45 256 232)">
  <!-- glow underlay -->
  <g filter="url(#soft)" opacity="0.55" fill="none" stroke-linecap="round" stroke-width="11">
    <path d="M124,256 C 150,208 224,206 250,232" stroke="#38bdf8"/>
    <path d="M388,256 C 362,208 288,206 262,232" stroke="#34d399"/>
  </g>

  <!-- request arc (client -> deck) -->
  <path d="M124,256 C 150,208 224,206 250,232" fill="none" stroke="#38bdf8"
        stroke-width="11" stroke-linecap="round"/>
  <polygon points="250,232 228.08,225.64 243.64,210.08" fill="#7dd3fc"/>
  <circle cx="124" cy="256" r="12" fill="#38bdf8"/>
  <circle cx="124" cy="256" r="5" fill="#e0f2fe"/>

  <!-- response arc (deck -> client) -->
  <path d="M388,256 C 362,208 288,206 262,232" fill="none" stroke="#34d399"
        stroke-width="11" stroke-linecap="round"/>
  <polygon points="262,232 268.36,210.08 283.92,225.64" fill="#6ee7b7"/>
  <circle cx="388" cy="256" r="12" fill="#34d399"/>
  <circle cx="388" cy="256" r="5" fill="#dcfce7"/>
  </g>
</svg>
