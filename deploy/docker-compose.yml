# Local dev infra (plan §10). Phase 1 needs only Postgres; the object store is the
# host ./data folder written directly by the gateway. A gateway service (with tshark
# bundled) can be added here later.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
