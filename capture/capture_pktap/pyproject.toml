[project]
name = "trafficdeck-capture-pktap"
version = "0.0.0"
description = "macOS per-process Chrome live-capture → the TrafficDeck gateway (PKTAP + SSLKEYLOGFILE)"
requires-python = ">=3.12"
dependencies = [
    "trafficdeck-capture-sdk",
    "trafficdeck-capture-chrome",
]

[project.scripts]
trafficdeck-capture-pktap = "capture_pktap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_pktap"]

[tool.uv.sources]
trafficdeck-capture-sdk = { path = "../capture_sdk", editable = true }
trafficdeck-capture-chrome = { path = "../capture_chrome", editable = true }
