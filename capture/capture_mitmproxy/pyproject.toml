[project]
name = "trafficdeck-capture-mitmproxy"
version = "0.0.0"
description = "mitmproxy capture agent → the TrafficDeck gateway (PushFlows; any device, incl. WireGuard)"
requires-python = ">=3.12"
dependencies = [
    "trafficdeck-capture-sdk",
    "mitmproxy>=11",
]

[project.scripts]
trafficdeck-capture-mitmproxy = "capture_mitmproxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_mitmproxy"]

[tool.uv.sources]
trafficdeck-capture-sdk = { path = "../capture_sdk", editable = true }
