[project]
name = "trafficdeck-capture-firefox"
version = "0.0.0"
description = "Firefox live-capture tool → the TrafficDeck gateway (dumpcap + SSLKEYLOGFILE)"
requires-python = ">=3.12"
dependencies = [
    "trafficdeck-capture-sdk",
]

[project.scripts]
trafficdeck-capture-firefox = "capture_firefox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_firefox"]

[tool.uv.sources]
trafficdeck-capture-sdk = { path = "../capture_sdk", editable = true }
