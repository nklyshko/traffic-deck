[project]
name = "trafficdeck-capture-chrome"
version = "0.0.0"
description = "Chrome live-capture tool → the TrafficDeck gateway (dumpcap + SSLKEYLOGFILE)"
requires-python = ">=3.12"
dependencies = [
    "trafficdeck-capture-sdk",
]

[project.scripts]
trafficdeck-capture-chrome = "capture_chrome.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_chrome"]

[tool.uv.sources]
trafficdeck-capture-sdk = { path = "../capture_sdk", editable = true }
