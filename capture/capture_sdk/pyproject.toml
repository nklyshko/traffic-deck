[project]
name = "trafficdeck-capture-sdk"
version = "0.0.0"
description = "Shared SDK for the capture tools: gRPC stubs, upload streaming, interactive prompts"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.76",
    "protobuf>=5.29",
    "questionary>=2",
    "trafficdeck-proto",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_sdk"]

[tool.uv.sources]
trafficdeck-proto = { path = "../../proto/python", editable = true }
