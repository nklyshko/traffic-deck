[project]
name = "trafficdeck-capture-android"
version = "0.0.0"
description = "Per-app Android capture (rooted emulator/device) → the TrafficDeck gateway"
requires-python = ">=3.12"
dependencies = [
    "trafficdeck-capture-sdk",
    # No frida here: client and frida-server versions must match, so it is chosen per
    # device from frida_versions.py and layered on at launch (frida_env.py). Pinning one
    # here would put a second, possibly different version under every capture.
]

[project.scripts]
trafficdeck-capture-android = "capture_android.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_android"]
artifacts = ["capture_android/*.js"]

[tool.uv.sources]
trafficdeck-capture-sdk = { path = "../capture_sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
