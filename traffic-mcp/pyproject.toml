[project]
name = "traffic-mcp"
version = "0.0.0"
description = "MCP server exposing recorded traffic sessions to LLM/agent clients (plan §7.4)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "grpcio>=1.76",
    "grpcio-tools>=1.76",
    "protobuf>=5.29",
]

[project.scripts]
traffic-mcp = "traffic_mcp.server:main"

[tool.uv]
package = false
